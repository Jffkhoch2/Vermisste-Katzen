<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vermisste Katzen</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            text-align: center;
            margin-top: 50px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .input-container, #finishButton {
            margin-top: 20px;
            display: none;
        }
        input[type="text"], input[type="file"] {
            margin: 10px 0;
            padding: 10px;
            width: 80%;
        }
        .output {
            margin-top: 30px;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        img {
            max-width: 100%;
            height: auto;
            margin-top: 10px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<h1>Vermisste Katzen</h1>
<button id="addButton">Hinzufügen</button>

<div class="input-container" id="inputContainer">
    <input type="text" placeholder="Gib deinen Text ein" id="textInput">
    <input type="file" id="fileInput">
    <button id="finishButton">Fertig</button>
</div>

<div id="outputContainer"></div>

<script>
    document.getElementById('addButton').addEventListener('click', function() {
        document.getElementById('inputContainer').style.display = 'block';
        document.getElementById('addButton').style.display = 'none';
    });

    document.getElementById('finishButton').addEventListener('click', function() {
        const text = document.getElementById('textInput').value;
        const file = document.getElementById('fileInput').files[0];

        if (text && file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const outputContainer = document.getElementById('outputContainer');
                const newEntry = document.createElement('div');
                newEntry.classList.add('output');
                newEntry.innerHTML = `
                    <h2>${text}</h2>
                    <img src="${e.target.result}" alt="Hochgeladenes Bild">
                `;
                outputContainer.appendChild(newEntry);

                // Save to localStorage
                const savedEntries = JSON.parse(localStorage.getItem('entries')) || [];
                savedEntries.push({ text, image: e.target.result });
                localStorage.setItem('entries', JSON.stringify(savedEntries));
            };
            reader.readAsDataURL(file);
        } else {
            alert("Bitte Text eingeben und ein Bild hochladen.");
        }
    });

    // Load saved entries from localStorage on page load
    window.onload = function() {
        const savedEntries = JSON.parse(localStorage.getItem('entries')) || [];
        savedEntries.forEach(entry => {
            const outputContainer = document.getElementById('outputContainer');
            const newEntry = document.createElement('div');
            newEntry.classList.add('output');
            newEntry.innerHTML = `
                <h2>${entry.text}</h2>
                <img src="${entry.image}" alt="Gespeichertes Bild">
            `;
            outputContainer.appendChild(newEntry);
        });
    };
</script>

</body>
</html>
