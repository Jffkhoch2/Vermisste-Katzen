<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vermisste Tiere</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #cookie-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            text-align: center;
            padding: 15px;
            display: none;
        }
        .hidden {
            display: none;
        }
        .button {
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        #add-form, #login-form, #admin-form {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .input-field {
            margin: 10px 0;
            padding: 8px;
            width: 100%;
        }
        #add-button {
            background-color: green;
            color: white;
        }
        #finish-button {
            background-color: blue;
            color: white;
        }
        #admin-button {
            background-color: black;
            color: white;
        }
        #login-button {
            background-color: blue;
            color: white;
        }
        #delete-button {
            background-color: red;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Cookie Banner -->
    <div id="cookie-banner">
        <p>Wir verwenden Cookies, um sicherzustellen, dass du die beste Erfahrung auf unserer Website machst. <button class="button" onclick="acceptCookies()">Akzeptieren</button></p>
    </div>

    <!-- Main Content -->
    <h1>Vermisste Tiere</h1>
    <button id="add-button" class="button" onclick="showAddForm()">Hinzufügen</button>
    <button id="admin-button" class="button" onclick="showAdminForm()">Admin</button>
    <button id="login-button" class="button" onclick="showLoginForm()">Anmelden</button>

    <!-- Add Form -->
    <div id="add-form">
        <h3>Tier Hinzufügen</h3>
        <input class="input-field" type="text" id="tier-name" placeholder="Name des Tiers" required>
        <input class="input-field" type="text" id="tier-beschreibung" placeholder="Beschreibung" required>
        <input class="input-field" type="url" id="tier-bild" placeholder="Bild URL" required>
        <button id="finish-button" class="button" onclick="addTier()">Fertig</button>
    </div>

    <!-- Login Form -->
    <div id="login-form">
        <h3>Login</h3>
        <input class="input-field" type="email" id="login-email" placeholder="Email" required>
        <input class="input-field" type="password" id="login-passwort" placeholder="Passwort" required>
        <button class="button" onclick="login()">Anmelden</button>
    </div>

    <!-- Admin Form -->
    <div id="admin-form">
        <h3>Admin Login</h3>
        <input class="input-field" type="password" id="admin-passwort" placeholder="Passwort" required>
        <button class="button" onclick="adminLogin()">Einloggen</button>
    </div>

    <!-- Missing Pets List -->
    <div id="missing-pets-list"></div>

    <script>
        let cookiesAccepted = false;
        let loggedIn = false;
        let admin = false;

        const missingPets = [];

        // Cookie Consent
        function acceptCookies() {
            cookiesAccepted = true;
            document.getElementById("cookie-banner").style.display = 'none';
        }

        // Show Add Form
        function showAddForm() {
            if (!cookiesAccepted) return;
            document.getElementById("add-form").style.display = 'block';
        }

        // Add Missing Pet
        function addTier() {
            const name = document.getElementById("tier-name").value;
            const beschreibung = document.getElementById("tier-beschreibung").value;
            const bild = document.getElementById("tier-bild").value;

            if (name && beschreibung && bild) {
                missingPets.push({ name, beschreibung, bild });
                updateMissingPetsList();
                document.getElementById("add-form").style.display = 'none';
            }
        }

        // Show Admin Form
        function showAdminForm() {
            if (!cookiesAccepted) return;
            const password = prompt("Geben Sie das Admin-Passwort ein:");
            if (password === "admin123") {
                admin = true;
                updateMissingPetsList();
            } else {
                alert("Falsches Passwort!");
            }
        }

        // Admin Login
        function adminLogin() {
            const password = document.getElementById("admin-passwort").value;
            if (password === "admin123") {
                admin = true;
                updateMissingPetsList();
                document.getElementById("admin-form").style.display = 'none';
            } else {
                alert("Falsches Passwort!");
            }
        }

        // Show Login Form
        function showLoginForm() {
            if (!cookiesAccepted) return;
            document.getElementById("login-form").style.display = 'block';
        }

        // Login
        function login() {
            const email = document.getElementById("login-email").value;
            const password = document.getElementById("login-passwort").value;
            if (email && password) {
                alert(`Benutzer ID gesendet an: missingpets.vermistekatzen@gmail.com`);
                document.getElementById("login-form").style.display = 'none';
            }
        }

        // Update Missing Pets List
        function updateMissingPetsList() {
            const listContainer = document.getElementById("missing-pets-list");
            listContainer.innerHTML = '';
            missingPets.forEach((pet, index) => {
                const petDiv = document.createElement("div");
                petDiv.innerHTML = `
                    <h4>${pet.name}</h4>
                    <p>${pet.beschreibung}</p>
                    <img src="${pet.bild}" alt="Bild des Tiers" width="100">
                    ${admin ? `<button class="button" onclick="deletePet(${index})" id="delete-button">Löschen</button>` : ''}
                `;
                listContainer.appendChild(petDiv);
            });
        }

        // Delete Pet
        function deletePet(index) {
            if (admin) {
                missingPets.splice(index, 1);
                updateMissingPetsList();
            }
        }
    </script>
</body>
</html>
